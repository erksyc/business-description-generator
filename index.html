<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Description Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    h1 { font-size: 20px; font-weight: 600; color: #111; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }
    .api-section {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .api-section label {
      font-size: 12px; font-weight: 600; color: #555;
      display: block; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field-group label { font-size: 13px; font-weight: 500; color: #444; }
    .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; color: #111; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #667eea; }
    .tip { font-size: 12px; color: #aaa; margin-top: 8px; }
    .tip a { color: #667eea; text-decoration: none; }
    button {
      width: 100%; padding: 12px;
      background: #667eea; color: white;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #5568d3; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .result-area { display: none; margin-top: 20px; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .result-label { font-size: 13px; font-weight: 500; color: #444; }
    .char-count { font-size: 12px; color: #888; }
    .result-box {
      background: #f8f8f8; border: 1px solid #e8e8e8;
      border-radius: 8px; padding: 14px;
      font-size: 14px; line-height: 1.6; color: #222;
      word-break: break-word; margin-bottom: 10px;
    }
    .bar-bg { height: 4px; background: #eee; border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    .copy-btn {
      background: white; color: #667eea;
      border: 1px solid #667eea; border-radius: 8px;
      padding: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .copy-btn:hover { background: #f0f4ff; }
    .error {
      display: none; margin-top: 12px; padding: 10px 14px;
      background: #fff0f0; border-left: 3px solid #e53935;
      border-radius: 4px; font-size: 13px; color: #c62828;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Business Description Generator</h1>
    <p class="subtitle">自動生成英文公司描述，限256字元以內</p>

    <div class="api-section">
      <label>Anthropic API Key</label>
      <input type="password" id="apiKey" placeholder="sk-ant-...">
      <p class="tip">Key 只存在瀏覽器，不會上傳。取得：<a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></p>
    </div>

    <div class="fields-row">
      <div class="field-group">
        <label>行業別</label>
        <input type="text" id="industry" placeholder="e.g. 服務業">
      </div>
      <div class="field-group">
        <label>服務機構</label>
        <input type="text" id="company" placeholder="e.g. 台灣鐵路公司">
      </div>
    </div>

    <button id="genBtn" onclick="generate()">Generate</button>

    <div class="result-area" id="resultArea">
      <div class="result-header">
        <span class="result-label">Business Description</span>
        <span class="char-count" id="charCount">0 / 256</span>
      </div>
      <div class="result-box" id="resultText"></div>
      <div class="bar-bg"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
      <button class="copy-btn" onclick="copyResult()">Copy to Clipboard</button>
    </div>

    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    ['industry','company'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') generate();
      });
    });

    async function generate() {
      const apiKey  = document.getElementById('apiKey').value.trim();
      const industry = document.getElementById('industry').value.trim();
      const company  = document.getElementById('company').value.trim();

      if (!apiKey)            { showError('請輸入 Anthropic API Key'); return; }
      if (!industry || !company) { showError('請填寫行業別和服務機構'); return; }

      hideError();
      const btn = document.getElementById('genBtn');
      btn.textContent = 'Generating...';
      btn.disabled = true;
      document.getElementById('resultArea').style.display = 'none';

      try {
        const prompt = `Generate a professional English business description for a Taiwan-based company.

Company: ${company}
Industry: ${industry}

Rules:
- Write a single complete, natural paragraph
- MUST be 256 characters or fewer — count every character carefully before responding
- Include: industry sector, Taiwan as operating country, products/services offered, primary revenue source
- ASCII characters only (no Chinese, no full-width punctuation)
- Must be a fully complete sentence, not cut off mid-way

Output only the description, nothing else.`;

        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-allow-browser': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 200,
            messages: [{ role: 'user', content: prompt }]
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || 'API error ' + res.status);
        }

        const data = await res.json();
        let desc = data.content[0].text.trim()
          .replace(/^["']|["']$/g, '')
          .replace(/[^\x00-\x7F]/g, '')
          .trim();

        // If still over 256, cut at last sentence ending before limit
        if (desc.length > 256) {
          const cut = desc.substring(0, 256);
          const lastDot = cut.lastIndexOf('.');
          desc = lastDot > 180
            ? cut.substring(0, lastDot + 1).trim()
            : cut.substring(0, cut.lastIndexOf(' ')).trim();
        }

        showResult(desc);
      } catch (e) {
        showError('Error: ' + e.message);
      } finally {
        btn.textContent = 'Generate';
        btn.disabled = false;
      }
    }

    function showResult(text) {
      document.getElementById('resultText').textContent = text;
      const len = text.length;
      document.getElementById('charCount').textContent = len + ' / 256';
      const pct = Math.min((len / 256) * 100, 100);
      const bar = document.getElementById('barFill');
      bar.style.width = pct + '%';
      bar.style.background = len > 256 ? '#e53935' : len > 220 ? '#fb8c00' : '#43a047';
      document.getElementById('resultArea').style.display = 'block';
    }

    function copyResult() {
      const text = document.getElementById('resultText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy to Clipboard'; }, 2000);
      });
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }
  </script>
</body>
</html>
