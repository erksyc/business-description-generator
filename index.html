<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Description Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .main-panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .upload-section label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        input[type="file"] {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        input[type="file"]:hover {
            border-color: #667eea;
        }

        .loading {
            display: none;
            padding: 12px;
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            border-radius: 4px;
            color: #1976d2;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .loading.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #2196f3;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #5568d3;
        }

        .company-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .company-card {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s;
        }

        .company-card:hover {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .company-card p {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
        }

        .company-card p:first-child {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .company-card p:last-child {
            color: #999;
            font-size: 12px;
        }

        .detail-panel {
            display: none;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 30px;
            background: #fafafa;
            margin-top: 20px;
        }

        .detail-panel.show {
            display: block;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 30px;
        }

        .detail-header h3 {
            font-size: 24px;
            color: #333;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .description-section {
            margin-bottom: 20px;
            border-top: 1px solid #ddd;
            padding-top: 30px;
        }

        .description-section label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            line-height: 1.5;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea.error {
            border-color: #f44336;
        }

        .char-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 12px;
        }

        .char-count {
            color: #999;
        }

        .char-warning {
            color: #f44336;
            display: none;
            font-weight: 600;
        }

        .char-warning.show {
            display: block;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 16px;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            border-color: #667eea;
            grid-column: 1 / -1;
        }

        .btn-primary:hover {
            background: #5568d3;
            border-color: #5568d3;
            color: white;
        }

        .status {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 20px;
            animation: slideIn 0.3s ease-out;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #c8e6c9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .status.error {
            background: #ffcdd2;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .company-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }

            .detail-panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Business Description Generator</h1>
            <p>Generate professional English business descriptions for your companies</p>
        </div>

        <div class="main-panel">
            <div class="upload-section">
                <label for="excelFile">📁 Upload Excel File</label>
                <div class="file-input-wrapper">
                    <input type="file" id="excelFile" accept=".xlsx,.xls" />
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span>Processing Excel file...</span>
            </div>

            <div id="mainContent" style="display: none;">
                <div class="search-box">
                    <input type="text" id="companySearch" placeholder="Search company name or industry...">
                    <button onclick="handleSearch()">🔍 Search</button>
                </div>

                <div id="companyGrid" class="company-grid"></div>

                <div id="detailPanel" class="detail-panel">
                    <div class="detail-header">
                        <h3 id="companyName"></h3>
                        <button class="close-btn" onclick="closeDetail()" title="Close">×</button>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Industry</div>
                            <div class="info-value" id="industryDisplay"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Revenue Source</div>
                            <div class="info-value" id="revenueDisplay"></div>
                        </div>
                    </div>

                    <div class="description-section">
                        <label for="businessDesc">Business Description (English)</label>
                        <textarea id="businessDesc" placeholder="Generated description will appear here..."></textarea>
                        <div class="char-info">
                            <span class="char-count"><span id="charCount">0</span> / 256 characters</span>
                            <span class="char-warning" id="charWarning">❌ Exceeds 256 characters</span>
                        </div>
                    </div>

                    <div class="button-grid">
                        <button onclick="generateDescription()">✨ Generate with AI</button>
                        <button onclick="copyToClipboard()">📋 Copy to Clipboard</button>
                        <button class="btn-primary" onclick="saveAndExport()">💾 Save & Export Excel</button>
                    </div>

                    <div id="status" class="status"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allCompanies = [];
        let currentIndex = -1;
        let workbook = null;

        document.getElementById('excelFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loading').classList.add('show');

            try {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const data = new Uint8Array(event.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    allCompanies = jsonData.map((row, idx) => ({
                        index: idx,
                        name: row['客戶姓名'] || '',
                        account: row['複委託帳號'] || '',
                        remarks: row['備註說明'] || '',
                        industry: extractField(row['備註說明'], '行業別'),
                        serviceOrg: extractField(row['備註說明'], '服務機構'),
                        revenue: extractField(row['備註說明'], '投資資金來源'),
                        description: row['Business Description'] || ''
                    })).filter(c => c.serviceOrg);

                    document.getElementById('excelFile').style.display = 'none';
                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('mainContent').style.display = 'block';
                    renderCompanyGrid();
                    showStatus(`✅ Loaded ${allCompanies.length} companies`, 'success');
                };
                reader.readAsArrayBuffer(file);
            } catch (e) {
                alert('Error reading file: ' + e.message);
                document.getElementById('loading').classList.remove('show');
            }
        });

        function extractField(text, fieldName) {
            if (!text) return '';
            const regex = new RegExp(`${fieldName}[：:][\\s]*([^\\n]+)`);
            const match = text.match(regex);
            return match ? match[1].trim() : '';
        }

        function renderCompanyGrid() {
            const grid = document.getElementById('companyGrid');
            grid.innerHTML = allCompanies.map((c, i) => `
                <div class="company-card" onclick="selectCompany(${c.index})">
                    <p>${c.serviceOrg}</p>
                    <p>${c.industry}</p>
                </div>
            `).join('');
        }

        function selectCompany(index) {
            const company = allCompanies[index];
            currentIndex = index;

            document.getElementById('companyName').textContent = company.serviceOrg;
            document.getElementById('industryDisplay').textContent = company.industry || 'N/A';
            document.getElementById('revenueDisplay').textContent = company.revenue || 'N/A';
            document.getElementById('businessDesc').value = company.description || '';
            document.getElementById('detailPanel').classList.add('show');
            updateCharCount();
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('show');
        }

        function updateCharCount() {
            const text = document.getElementById('businessDesc').value;
            const count = text.length;
            document.getElementById('charCount').textContent = count;

            if (count > 256) {
                document.getElementById('charWarning').classList.add('show');
                document.getElementById('businessDesc').classList.add('error');
            } else {
                document.getElementById('charWarning').classList.remove('show');
                document.getElementById('businessDesc').classList.remove('error');
            }
        }

        document.getElementById('businessDesc').addEventListener('input', updateCharCount);

        async function generateDescription() {
            const company = allCompanies[currentIndex];
            showStatus('⏳ Generating description from AI...', 'info');

            const prompt = `Generate a professional English business description (max 256 characters, NO full-width characters) for this Taiwan company:

Company: ${company.serviceOrg}
Industry: ${company.industry}
Revenue Source: ${company.revenue}

Requirements:
1. Max 256 characters total
2. Include: industry sector, country (Taiwan), main products/services, revenue source
3. Conversational tone, no bullet points
4. Only ASCII characters (no Chinese, no full-width symbols)
5. First sentence should define what they do

Example format: "Taiwan-based service company providing professional cleaning services. Generates revenue from corporate and residential clients through monthly maintenance contracts and one-time deep cleaning projects."

Generate now:`;

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 300,
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                if (!response.ok) throw new Error('API error: ' + response.status);

                const data = await response.json();
                let desc = data.content[0].text.trim();

                desc = desc.replace(/[^\x00-\x7F]/g, '').trim();
                if (desc.length > 256) {
                    desc = desc.substring(0, 256).trim();
                }

                document.getElementById('businessDesc').value = desc;
                updateCharCount();
                showStatus('✅ Generated successfully!', 'success');
            } catch (e) {
                showStatus('❌ Error: ' + e.message, 'error');
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status show ' + type;

            if (type === 'success') {
                setTimeout(() => { status.classList.remove('show'); }, 3000);
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('businessDesc').value;
            if (!text) {
                showStatus('❌ Nothing to copy', 'error');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showStatus('✅ Copied to clipboard!', 'success');
            });
        }

        function handleSearch() {
            const query = document.getElementById('companySearch').value.toLowerCase();
            const grid = document.getElementById('companyGrid');

            const filtered = allCompanies.filter(c =>
                c.serviceOrg.toLowerCase().includes(query) ||
                c.industry.toLowerCase().includes(query)
            );

            grid.innerHTML = filtered.map(c => `
                <div class="company-card" onclick="selectCompany(${c.index})">
                    <p>${c.serviceOrg}</p>
                    <p>${c.industry}</p>
                </div>
            `).join('');
        }

        async function saveAndExport() {
            if (currentIndex === -1) {
                showStatus('❌ Please select a company first', 'error');
                return;
            }

            const company = allCompanies[currentIndex];
            const desc = document.getElementById('businessDesc').value;

            if (desc.length > 256) {
                showStatus('❌ Description exceeds 256 characters', 'error');
                return;
            }

            showStatus('⏳ Saving to Excel and preparing download...', 'info');

            try {
                allCompanies[currentIndex].description = desc;

                const ws = XLSX.utils.json_to_sheet(allCompanies.map(c => ({
                    '客戶身分證': c.index,
                    '客戶姓名': c.name,
                    '複委託帳號': c.account,
                    '備註說明': `行業別：${c.industry}  服務機構：${c.serviceOrg}  投資資金來源：${c.revenue}`,
                    'Business Description': c.description,
                    '字元數': c.description.length
                })));

                if (!workbook.Sheets['補雇主資料明細']) {
                    workbook.Sheets['補雇主資料明細'] = ws;
                } else {
                    workbook.Sheets['補雇主資料明細'] = ws;
                }

                XLSX.writeFile(workbook, '補雇主資料明細_updated.xlsx');
                showStatus('✅ Excel saved! Company: ' + company.serviceOrg, 'success');
            } catch (e) {
                showStatus('❌ Error: ' + e.message, 'error');
            }
        }
    </script>
</body>
</html>
